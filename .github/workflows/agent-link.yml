name: Agent Link
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[platform]" pytest pytest-asyncio
      - name: Core Agent Link and connection diagnostics
        env:
          PYTHONUTF8: '1'
        run: >-
          python -m pytest
          tests/test_agentlink_contracts.py tests/test_agentlink_tool.py
          tests/test_agentlink_acp_client.py tests/test_agentlink_assignment.py
          tests/test_agentlink_handoff_store.py tests/test_agentlink_desktop_handoff.py
          tests/test_arena_doctor.py -q
      - name: PAL task failure visibility
        env:
          PYTHONUTF8: '1'
        run: >-
          python -m pytest tests/test_arena_worker.py -q
          -k "pal_task_failure_preserves_actionable_error or pal_transport_failure_preserves_actionable_error or workbuddy_response_is_not_claimed_as_completed"
