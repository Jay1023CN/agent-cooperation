name: Arena Native Delivery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/arena-delivery.yml'
      - 'arena/**'
      - 'agent_link/**'
      - 'frontend/**'
      - 'scripts/arena_launcher.py'
      - 'scripts/build_arena_bundle.py'
      - 'tests/test_arena*'
      - 'docs/arena*.md'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install standalone UI dependencies
        working-directory: frontend
        run: npm ci
      - name: Check standalone UI source
        working-directory: frontend
        run: npm run check
      - name: Test standalone UI request behavior
        working-directory: frontend
        run: npm test
      - name: Build standalone UI
        working-directory: frontend
        run: npm run build
      - name: Verify committed UI matches its sources
        run: git diff --exit-code -- arena/static
      - name: Install build and test dependencies
        run: python -m pip install -e ".[platform]" pytest pytest-asyncio pytest-mock pyinstaller==6.22.3
      - name: Test platform contracts before packaging
        env:
          PYTHONUTF8: '1'
        run: python -m pytest tests -q -m "not integration" -k arena
      - name: Build and smoke-test native application
        env:
          PYTHONUTF8: '1'
        run: python scripts/build_arena_bundle.py --output dist/arena-delivery
      - name: Upload verified bundle and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pal-arena-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/arena-delivery/*
          if-no-files-found: error
          retention-days: 14
