name: Arena Native Delivery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/arena-delivery.yml'
      - 'arena/**'
      - 'agent_link/**'
      - 'frontend/**'
      - 'scripts/arena_launcher.py'
      - 'scripts/build_arena_bundle.py'
      - 'tests/test_arena*'
      - 'docs/arena*.md'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install standalone UI dependencies
        working-directory: frontend
        run: npm ci
      - name: Check standalone UI source
        working-directory: frontend
        run: npm run check
      - name: Test standalone UI request behavior
        if: runner.os == 'macOS'
        working-directory: frontend
        run: npm test
      - name: Build standalone UI
        working-directory: frontend
        run: npm run build
      - name: Verify committed UI matches its sources
        run: git diff --exit-code -- arena/static
      - name: Install native build dependencies
        run: python -m pip install -e ".[platform]" pyinstaller==6.22.3
      - name: Build and smoke-test native application
        env:
          PYTHONUTF8: '1'
        run: python scripts/build_arena_bundle.py --output dist/arena-delivery
      - name: Upload verified bundle and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pal-arena-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/arena-delivery/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pal-arena-*
          path: dist/arena-delivery
          merge-multiple: true
      - name: Verify bundles and prepare pinned Mac installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          output = Path('dist/arena-delivery')
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()[:12]
          for platform, extension in [('darwin-arm64', 'tar.gz'), ('windows-amd64', 'zip')]:
              name = f'pal-arena-{platform}-{revision}.{extension}'
              archive = output / name
              expected, recorded_name = (output / (name + '.sha256')).read_text().split()
              assert recorded_name.lstrip('*') == name
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, name

          tag = os.environ['RELEASE_TAG']
          installer = Path('docs/install-mac-mini.command').read_text()
          lines = installer.splitlines()
          lines = [f'TAG="{tag}"' if line.startswith('TAG=') else
                   f'NAME="pal-arena-darwin-arm64-{revision}"' if line.startswith('NAME=') else line
                   for line in lines]
          installer = '\n'.join(lines) + '\n'
          subprocess.run(['bash', '-n'], input=installer, text=True, check=True)
          info = zipfile.ZipInfo('安装 Agent Cooperation.command')
          info.create_system = 3
          info.external_attr = 0o100755 << 16
          with zipfile.ZipFile(output / f'Mac-mini-Setup-{tag}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.writestr(info, installer)
              archive.writestr('使用说明.txt', '解压后在 Apple Silicon Mac 上运行安装助手。安装时下载并校验对应版本，数据保存在用户目录。\n')
          PY
      - name: Publish verified packages directly to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft
          gh release upload "$RELEASE_TAG" dist/arena-delivery/* --clobber
