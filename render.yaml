services:
  - type: web
    name: winter-wishes-tree
    runtime: node
    plan: free
    region: singapore
    branch: winter-wishes-deploy
    buildCommand: cd winter-wishes && npm install --omit=dev
    startCommand: cd winter-wishes && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: winter-wishes-db
          property: connectionString
databases:
  - name: winter-wishes-db
    plan: free
    region: singapore
    databaseName: winter_wishes_db
    user: winter_wishes_db_user
